plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

group   = project.mod_group_id
version = project.mod_version

repositories {
    mavenCentral()
}

neoForge {
    version = project.neoforge_version

    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Simple Voice Chat API — compileOnly + ModList-guarded; the mod jar is on the server set.
    compileOnly(files("../../server-mods/voicechat-neoforge-1.21.1-2.6.17.jar"))

    // Vosk offline speech-to-text (Apache-2.0). jarJar bundles it into the mod jar; the vosk
    // artifact carries the win/linux/mac native libs. The MODEL is NOT bundled (~40 MB) — loaded
    // from config/coffees_voice_captions/model at runtime.
    jarJar(implementation("com.alphacephei:vosk:0.3.45"))
    // Vosk's native loader is JNA — but NeoForge ALREADY provides com.sun.jna (neoforge.coremods),
    // so bundling our own copy makes module resolution fail ("reads more than one module named
    // com.sun.jna"). Use NeoForge's JNA: compileOnly here, present at runtime from the platform.
    compileOnly("net.java.dev.jna:jna:5.14.0")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Vendor'  : project.mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.mod_name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : project.mod_authors,
        ])
    }
}
