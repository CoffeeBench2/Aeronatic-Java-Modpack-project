[[mods]]
modId       = "coffeesaero_tweaks"
version     = "1.3.3"
displayName = "Coffees Aero Tweaks"
authors     = "MrCoffeeBench"
credits     = "Coffees Aero SMP"
logoFile    = "logo.png"
description = "Server recipe tweaks for Coffees Aero SMP: crush purpur blocks back into popped chorus fruit, mix blaze powder with slime into blaze rods. Whitelists Create shop blocks (stock ticker + table cloths) for right-click in FTB Chunks claims. Haunting obsidian always gives crying obsidian; washing only strips dye from vanilla stained glass, so Create Framed glass washes back to framed glass."

# Load AFTER the mods whose recipes this jar overrides, so the override is the copy that wins.
[[dependencies.coffeesaero_tweaks]]
    modId = "create"
    type = "optional"
    versionRange = "*"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.coffeesaero_tweaks]]
    modId = "create_ultimate_factory"
    type = "optional"
    versionRange = "*"
    ordering = "AFTER"
    side = "BOTH"
