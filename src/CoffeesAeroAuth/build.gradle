plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

group   = project.mod_group_id
version = project.mod_version

repositories {
    mavenCentral()
}

neoForge {
    version = project.neoforge_version

    runs {
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Embedded in the JAR via NeoForge JarJar — no external install needed
    jarJar(implementation("com.zaxxer:HikariCP:5.1.0"))
    jarJar(implementation("com.mysql:mysql-connector-j:8.3.0"))

    // log4j-core: shipped by Minecraft at runtime (2.22.1), needed at compile time for the
    // Feature B console-mirror appender. compileOnly so it is NOT bundled into the mod jar.
    compileOnly("org.apache.logging.log4j:log4j-core:2.22.1")

    // FTB Chunks/Library/Teams API for the rail auto-claim protection. compileOnly — these mods are
    // present at runtime in the pack; we guard every call behind a ModList isLoaded check so the
    // classes are never linked if FTB Chunks is absent. Local jars (offline-friendly).
    compileOnly(files("libs/ftb-chunks.jar", "libs/ftb-library.jar", "libs/ftb-teams.jar"))

    // Create, for the RPM cap mixin's handler signature (KineticBlockEntity).
    // 🔑 compileOnly with the REAL type on purpose. A mixin handler parameter typed Object never
    // matches the descriptor, and under require=0 — which an optional-mod mixin needs — that
    // failure is SILENT: no crash, no feature. See RotationPropagatorRpmCapMixin.
    // ponder/flywheel/Registrate are Create's own jar-in-jar libraries. They are needed only so
    // javac can resolve KineticBlockEntity's supertypes (it implements ponder's VirtualBlockEntity);
    // extract them from create's META-INF/jarjar/ if this ever needs refreshing.
    compileOnly(files("libs/create.jar", "libs/ponder.jar", "libs/flywheel.jar", "libs/Registrate.jar"))

    // Sable 2.0.5 for the sub-level speed cap mixin. Same rule as Create above: the handler takes
    // ServerSubLevel / RigidBodyHandle / SubLevelPhysicsSystem as REAL types, because an Object-typed
    // parameter never matches the descriptor and under require=0 fails silently.
    // ⚠️ RapierPhysicsPipeline is NOT in this jar — it lives in the JiJ nested jar
    // META-INF/jarjar/dev.ryanhcode.sable.sable-sable_rapier-1.21.1-2.0.5.jar. Everything the cap
    // needs (ServerSubLevel, RigidBodyHandle, the PhysicsPipeline API) is in the main jar, which is
    // why the mixin targets ServerSubLevel and not the pipeline.
    // sable-companion is extracted from Sable's own META-INF/jarjar. It is needed only to RESOLVE
    // ServerSubLevel's supertype chain (SubLevelAccess) — without it javac cannot access any member
    // of ServerSubLevel at all, not even getRuntimeId(). Both are compileOnly; neither is bundled.
    compileOnly(files("libs/sable.jar", "libs/sable-companion.jar"))

    // CoffeesAeroSkins API for the skins backend bridge (SkinsHook). compileOnly + ModList-guarded,
    // same pattern as FTB. Build CoffeesAeroSkins first (sibling project).
    // 2026-09-20: was pinned to 1.0.1, a filename that no longer exists — the sibling project is on
    // 1.1.0 (and 1.1.0 is what runs on live), so a clean checkout could not compile this mod at all:
    // the whole com.coffeesaerosmp.skins package vanished from the classpath and SkinsHook failed
    // with 11 "does not override" errors that look like an API change and are really a missing jar.
    compileOnly(files("../CoffeesAeroSkins/build/libs/CoffeesAeroSkins-1.1.1.jar"))

    // Unit tests for the PURE display core only. PlayerDisplay/StaffBadges import no Minecraft
    // classes, so these run without a game. Anything needing a ServerPlayer is boot-tested instead.
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Gson reaches main through Minecraft but not the test classpath. Same version MC 1.21.1 ships.
    testImplementation "com.google.code.gson:gson:2.10.1"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events "passed", "failed", "skipped" }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Vendor'  : project.mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.mod_name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : project.mod_authors,
        ])
    }
}
