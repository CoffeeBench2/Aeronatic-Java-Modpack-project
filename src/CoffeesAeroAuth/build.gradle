plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

group   = project.mod_group_id
version = project.mod_version

repositories {
    mavenCentral()
}

neoForge {
    version = project.neoforge_version

    runs {
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Embedded in the JAR via NeoForge JarJar — no external install needed
    jarJar(implementation("com.zaxxer:HikariCP:5.1.0"))
    jarJar(implementation("com.mysql:mysql-connector-j:8.3.0"))

    // log4j-core: shipped by Minecraft at runtime (2.22.1), needed at compile time for the
    // Feature B console-mirror appender. compileOnly so it is NOT bundled into the mod jar.
    compileOnly("org.apache.logging.log4j:log4j-core:2.22.1")

    // FTB Chunks/Library/Teams API for the rail auto-claim protection. compileOnly — these mods are
    // present at runtime in the pack; we guard every call behind a ModList isLoaded check so the
    // classes are never linked if FTB Chunks is absent. Local jars (offline-friendly).
    compileOnly(files("libs/ftb-chunks.jar", "libs/ftb-library.jar", "libs/ftb-teams.jar"))

    // CoffeesAeroSkins API for the skins backend bridge (SkinsHook). compileOnly + ModList-guarded,
    // same pattern as FTB. Build CoffeesAeroSkins first (sibling project).
    compileOnly(files("../CoffeesAeroSkins/build/libs/CoffeesAeroSkins-1.0.1.jar"))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Vendor'  : project.mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.mod_name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : project.mod_authors,
        ])
    }
}
