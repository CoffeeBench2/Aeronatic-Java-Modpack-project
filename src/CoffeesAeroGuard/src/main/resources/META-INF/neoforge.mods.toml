modLoader = "javafml"
loaderVersion = "[4,)"
license = "All Rights Reserved (c) 2026 MrCoffeeBench"

[[mods]]
modId       = "coffees_aero_guard"
version     = "${file.jarVersion}"
displayName = "Coffees Aero Guard"
authors     = "MrCoffeeBench"
credits     = "Coffees Aero SMP"
logoFile    = "logo.png"
description = '''
Claim and interaction rules for Coffees Aero SMP.

Split out of CoffeesAeroAuth on 2026-08-09: auth had grown to 15,550 lines across 82 files, and
protection changes (a seat tag, a claim override) should not require restarting the mod that owns
login, MySQL and Discord. This mod owns "who may interact with what" and nothing else.

Server-side only. Registers no blocks or items, so it is safe to add to - and remove from - a live
world.
'''

[[mixins]]
config = "coffeesaeroguard.mixins.json"

# Diagnostic only, required=false: it targets another mod's class by name, so a rename
# must degrade to a warning rather than crashing a live server at boot.
[[mixins]]
config = "coffeesaeroguard.diagnostic.mixins.json"

[[dependencies.coffees_aero_guard]]
    modId        = "neoforge"
    type         = "required"
    versionRange = "[21.1,)"
    ordering     = "NONE"
    side         = "BOTH"

[[dependencies.coffees_aero_guard]]
    modId        = "minecraft"
    type         = "required"
    versionRange = "[1.21.1,1.22)"
    ordering     = "NONE"
    side         = "BOTH"
