plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

group   = project.mod_group_id
version = project.mod_version

repositories {
    mavenCentral()
}

neoForge {
    version = project.neoforge_version

    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // FTB Chunks claim guard for the End arena (EndArenaClaims). Its claim event is an ARCHITECTURY
    // event rather than a NeoForge bus event, so architectury is needed on the compile classpath too,
    // and ftb-library supplies ChunkDimPos which the event hands us.
    //
    // compileOnly + ModList-guarded: nothing is shaded, and the classes are only touched when
    // ftbchunks is actually loaded. Jars are borrowed from auth's libs/ (which is gitignored — 19 MB
    // of redistributed mods has no business in a public repo) and from the server mod set, the same
    // arrangement CoffeesAeroRailguard uses.
    compileOnly(files(
        "../CoffeesAeroAuth/libs/ftb-chunks.jar",
        "../CoffeesAeroAuth/libs/ftb-library.jar",
        "../../server-mods/architectury-13.0.11-neoforge.jar"))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Vendor'  : project.mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.mod_name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : project.mod_authors,
        ])
    }
}
