plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

group   = project.mod_group_id
version = project.mod_version

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            // Dev runs have no jar version ("${file.jarVersion}"); the AeroCore handshake reports this instead.
            systemProperty 'aerocore.devVersion', project.version
            // Dev-only visual test: ./gradlew runClient -PwardrobeHarness=<path to wardrobe-sample.json>
            if (project.hasProperty('fittingHarness')) {
                systemProperty 'aerocore.fittingHarness', project.property('fittingHarness')
                if (project.hasProperty('fittingSecret')) systemProperty 'aerocore.fittingSecret', project.property('fittingSecret')
                if (project.hasProperty('fittingManual')) systemProperty 'aerocore.fittingManual', 'true'
                if (project.hasProperty('cosmeticsShots')) systemProperty 'aerocore.cosmeticsShots', 'true'
                if (project.hasProperty('devNoHello')) systemProperty 'aerocore.devNoHello', 'true'
                programArguments.addAll('--width', '1600', '--height', '900')
            }
            if (project.hasProperty('wardrobeHarness')) {
                systemProperty 'aerocore.wardrobeHarness', project.property('wardrobeHarness')
                programArguments.addAll('--width', '1600', '--height', '900')
            }
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // JEI, compile-only. JemiPluginMixin injects into EMI's JEI plugin, and Mixin requires the
    // handler's parameter types to MATCH the target method's descriptor exactly — declaring the
    // argument as Object produced "Invalid descriptor ... Expected IRuntimeRegistration but found
    // Object" and the mixin silently did not apply (2026-08-18). Never shipped: compileOnly, and
    // JEI is already in the pack at runtime.
    compileOnly fileTree(dir: 'libs', include: ['jei-*.jar'])
    // 1.4.0: contrails find the ship a player rides through Sable's client sub-level container. Compile-only (the
    // pack ships Sable); every Sable type is touched only inside cosmetics.ShipProbe.Impl, after ModList says Sable
    // is loaded, so a client without it (or a Sable API change) just draws no contrails.
    compileOnly(files("../CoffeesAeroAuth/libs/sable.jar", "../CoffeesAeroAuth/libs/sable-companion.jar"))
    // 1.4.0: Create's own particles (cubes, steam jets, air, rotation rings, fluid drips) for the cosmetics. Same
    // isolation: only cosmetics.CreateFx.Impl touches Create types, after ModList says Create is loaded.
    compileOnly(files("../CoffeesAeroAuth/libs/create.jar"))
}

// CurseForge distribution: build with -PnoUpdater to EXCLUDE the in-client updater subsystem
// from the jar entirely (CF policy forbids mods that fetch files from outside the pack; the CF
// app is the updater on that channel). UpdaterBridge reflects on these classes and degrades to
// "connect directly" when they're absent, so the same source produces both jars.
def noUpdater = project.hasProperty('noUpdater')

jar {
    if (noUpdater) {
        archiveClassifier = 'cf'
        exclude 'com/coffeesaerosmp/core/update/**'
        exclude 'com/coffeesaerosmp/core/version/**'
        exclude 'com/coffeesaerosmp/core/screen/UpdateScreen*.class'
        exclude 'com/coffeesaerosmp/core/screen/UpdatingScreen*.class'
    }
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Vendor'  : project.mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.mod_name,
            'Implementation-Version': project.version + (noUpdater ? '-cf' : ''),
            'Implementation-Vendor' : project.mod_authors,
        ])
    }
}