plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

group   = project.mod_group_id
version = project.mod_version

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // JEI, compile-only. JemiPluginMixin injects into EMI's JEI plugin, and Mixin requires the
    // handler's parameter types to MATCH the target method's descriptor exactly — declaring the
    // argument as Object produced "Invalid descriptor ... Expected IRuntimeRegistration but found
    // Object" and the mixin silently did not apply (2026-08-18). Never shipped: compileOnly, and
    // JEI is already in the pack at runtime.
    compileOnly fileTree(dir: 'libs', include: ['jei-*.jar'])
}

// CurseForge distribution: build with -PnoUpdater to EXCLUDE the in-client updater subsystem
// from the jar entirely (CF policy forbids mods that fetch files from outside the pack; the CF
// app is the updater on that channel). UpdaterBridge reflects on these classes and degrades to
// "connect directly" when they're absent, so the same source produces both jars.
def noUpdater = project.hasProperty('noUpdater')

jar {
    if (noUpdater) {
        archiveClassifier = 'cf'
        exclude 'com/coffeesaerosmp/core/update/**'
        exclude 'com/coffeesaerosmp/core/version/**'
        exclude 'com/coffeesaerosmp/core/screen/UpdateScreen*.class'
        exclude 'com/coffeesaerosmp/core/screen/UpdatingScreen*.class'
    }
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Vendor'  : project.mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.mod_name,
            'Implementation-Version': project.version + (noUpdater ? '-cf' : ''),
            'Implementation-Vendor' : project.mod_authors,
        ])
    }
}