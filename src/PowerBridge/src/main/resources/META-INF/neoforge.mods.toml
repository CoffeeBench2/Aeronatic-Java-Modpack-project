[[mods]]
modId           = "coffees_power_bridge"
version         = "1.0.0"
displayName     = "Coffees Power Bridge"
description     = '''
Bridges Forge Energy (FE/IF) and Create's Stress Units (SU/RPM).

FE Electric Motor — feed FE in, get a Create shaft spinning.
Kinetic Dynamo   — spin a Create shaft, generate FE for IE wires.

Electromagnetically themed: magnetised steel rotors, copper coils,
and realistic 75% round-trip efficiency to prevent infinite loops.
'''

