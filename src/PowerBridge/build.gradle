plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

group   = project.mod_group_id
version = project.mod_version

repositories {
    maven {
        url = 'https://maven.blamejared.com'  // Registrate
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        // Fallback mirror for Registrate
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven { url = 'https://maven.ithundxr.dev/releases' }  // Flywheel (in Create's classpath)
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Create 6.0 slim JAR — API surface only, no transitive deps required
    compileOnly(files('libs/create-slim.jar'))

    // Ponder API — needed for Create's SmartBlockEntity/KineticBlockEntity class hierarchy
    compileOnly(files('libs/ponder-neoforge.jar'))

    // Immersive Engineering — for IEnergyStorage awareness (optional runtime)
    compileOnly(files('libs/ImmersiveEngineering-1.21.1.jar'))
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Vendor'  : project.mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.mod_name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : project.mod_authors,
        ])
    }
}
