config-version = "2.7"

# Players connect to this address
bind = "0.0.0.0:25575"

motd = "<gradient:#00aaff:#00ffaa>Coffees Aero SMP</gradient> <gray>| Premium & Cracked"

show-max-players = 100

# Must be false — AeroVelocity handles premium/cracked detection itself
online-mode = false

force-key-authentication = false
prevent-client-proxy-connections = false

# MODERN forwarding — sends player UUID + IP to backend securely
player-info-forwarding-mode = "NONE"

# NeoForge backend needs this (Sinytra Connector is present)
announce-forge = true

[servers]
main = "127.0.0.1:25565"

[server]
try = ["main"]

[forced-hosts]
# Add your domain here once you have one:
# "play.coffeesaerosmp.net" = ["lobby"]

[advanced]
compression-threshold = 256
compression-level = -1
login-ratelimit = 3000
connection-timeout = 5000
read-timeout = 30000
haproxy-protocol = false
tcp-fast-open = false
bungee-plugin-message-channel = true
show-ping-requests = false
failover-on-unexpected-server-disconnect = true
announce-proxy-commands = true
log-command-executions = false
log-player-connections = true

[query]
enabled = false
port = 25577
map = "Coffees Aero SMP"
show-plugins = false
