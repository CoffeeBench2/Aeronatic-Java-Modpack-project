#CoffeesAeroSMP Core - Client Configuration
#Server address policy: "managed" = use the address built into CoffeesAeroCore (not stored in any
#file). Any other value is an explicit admin override and is used verbatim.
serverIp = "managed"
#Minecraft username that can access the Admin Settings screen
adminUsername = "MrCoffeeBench"
#Bundled pack version - auto-stamped by the build script every build. Do not edit by hand.
packVersion = "1.8.2"
#Where players download the latest pack (shown when their pack is outdated).
updateUrl = "https://github.com/CoffeeBench2/Aeronatic-Java-Modpack-project"
#Raw URL of version.json the client polls for the latest pack version. Blank = disable the check.
versionCheckUrl = "https://raw.githubusercontent.com/CoffeeBench2/Aeronatic-Java-Modpack-project/main/version.json"
